name: Validacion SHARK V15

# Corre tests y backtests en un entorno con red de verdad y deja
# los resultados escritos en resultados/, para que queden en el
# repositorio y no solo en los logs de Actions.
on:
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Timeframe intradia (30m, 1h)"
        required: false
        default: "30m"
      assets:
        description: "Activos separados por coma. Vacio = los de config.py"
        required: false
        default: ""
      historico_largo:
        description: "Correr tambien el backtest diario de 15 anos"
        type: boolean
        required: false
        default: true
  push:
    # Todas las ramas: asi una rama se valida ANTES de fusionarla
    # a main, que es lo que Render despliega automaticamente. Sin
    # esto, codigo roto llegaria al bot en vivo y los tests se
    # enterarian despues.
    branches: ["**"]
    paths-ignore:
      - "resultados/**"
      - "**.md"

permissions:
  contents: write

jobs:
  validacion:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preparar carpeta de resultados
        run: |
          mkdir -p resultados
          {
            echo "# Validacion SHARK V15"
            echo
            echo "Fecha:   $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "Commit:  ${GITHUB_SHA::8}"
            echo "Disparo: ${GITHUB_EVENT_NAME}"
            echo
          } > resultados/ultimo.md

      - name: Entorno
        run: |
          {
            echo '## Entorno'
            echo '```'
            python -c "import pandas; print('pandas  ', pandas.__version__)"
            python -c "import numpy; print('numpy   ', numpy.__version__)"
            python -c "import yfinance; print('yfinance', yfinance.__version__)"
            python -c "import pandas as pd; print('tzdata OK:', pd.Timestamp('2026-01-01', tz='UTC').tz_convert('US/Eastern'))"
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Tests de regresion
        run: |
          {
            echo '## Tests de regresion'
            echo '```'
          } >> resultados/ultimo.md
          set -o pipefail
          python tests/test_config.py    2>&1 | tail -5  | tee -a resultados/ultimo.md
          python tests/test_arreglos.py  2>&1 | tail -5  | tee -a resultados/ultimo.md
          python tests/test_historial.py 2>&1 | tail -5  | tee -a resultados/ultimo.md
          python tests/test_costes.py    2>&1 | tail -12 | tee -a resultados/ultimo.md
          python tests/test_cartera.py   2>&1 | tail -5  | tee -a resultados/ultimo.md
          python tests/test_noticias.py  2>&1 | tail -5  | tee -a resultados/ultimo.md
          python tests/test_oraculos.py  2>&1 | tail -5  | tee -a resultados/ultimo.md
          python tests/test_causalidad.py 2>&1 | tail -5 | tee -a resultados/ultimo.md
          python tests/test_cooldown.py  2>&1 | tail -14 | tee -a resultados/ultimo.md
          python tests/test_institucional.py 2>&1 | tail -10 | tee -a resultados/ultimo.md
          python tests/test_observacion.py 2>&1 | tail -8  | tee -a resultados/ultimo.md
          { echo '```'; echo; } >> resultados/ultimo.md

      - name: Pruebas de aceptacion economica (hoy FALLAN a proposito)
        # No bloquea: hoy fallan las 22 porque el motor economico esta sin
        # corregir tras la auditoria del 2026-10-19. Corre igual para que
        # el hueco sea visible en cada corrida en vez de quedar escondido.
        # Cuando pasen todas, quitar continue-on-error y pasarla al paso de
        # regresion.
        continue-on-error: true
        run: |
          python tests/test_aceptacion.py 2>&1 | tee /tmp/aceptacion.txt || true
          {
            echo '## Aceptacion economica (pendiente)'
            echo
            echo 'Contratos economicos que el motor todavia NO cumple.'
            echo 'Mientras fallen, ninguna cifra de resultados/ es una'
            echo 'medicion. Ver resultados/LEEME_RESULTADOS_INVALIDADOS.md'
            echo
            echo '```'
            tail -40 /tmp/aceptacion.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Comprobar que todo importa
        env:
          TELEGRAM_TOKEN: ""
          TELEGRAM_CHAT_ID: ""
        run: |
          python - <<'PY' 2>&1 | tee /tmp/imports.txt
          import importlib
          modulos = [
              "config", "storage", "indicators", "data_feed", "market_regime",
              "signals", "opportunity_scanner", "risk_management",
              "session_volatility_intelligence", "risk_control_engine",
              "trade_intelligence", "ai_filter", "final_decision_engine",
              "paper_broker", "telegram_alerts", "historial_mercado",
              "noticias", "gemini_filter", "zona_mercado",
              "institucional", "institucional.referencia",
              "institucional.contratos", "institucional.configuracion",
              "institucional.vista", "institucional.modulos",
              "institucional.observacion",
              "live_engine", "main",
          ]
          fallos = []
          for m in modulos:
              try:
                  importlib.import_module(m)
              except Exception as e:
                  print(f"FALLA {m}: {type(e).__name__}: {e}")
                  fallos.append(m)
          print(f"{len(modulos) - len(fallos)}/{len(modulos)} modulos importan")
          raise SystemExit(1 if fallos else 0)
          PY
          {
            echo '## Imports'
            echo '```'
            cat /tmp/imports.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Diagnostico del feed
        env:
          TIMEFRAME: ${{ github.event.inputs.timeframe || '30m' }}
          ASSETS: ${{ github.event.inputs.assets }}
        run: |
          python - <<'PY' 2>&1 | tee /tmp/feed.txt
          import config
          from data_feed import get_data
          print(f"Timeframe {config.TIMEFRAME} | Periodo {config.PERIOD} | MIN_BARS {config.MIN_BARS}")
          print(f"Providers {config.DATA_PROVIDER_ORDER}")
          print()
          print(f"{'ACTIVO':7} {'PROVIDER':10} {'VELAS':>6} {'DIAS':>5} {'X/DIA':>6}  HORAS ET")
          for t in config.ASSETS:
              try:
                  df, prov = get_data(t, config.TIMEFRAME, config.PERIOD)
                  idx = df.index.tz_convert("US/Eastern")
                  dias = idx.normalize().nunique()
                  horas = sorted(set(idx.hour))
                  print(f"{t:7} {prov:10} {len(df):6} {dias:5} {len(df)/dias:6.1f}  {horas}")
                  print(f"{'':7} {idx[0]}  ->  {idx[-1]}")
              except Exception as e:
                  print(f"{t:7} ERROR {type(e).__name__}: {e}")
          PY
          {
            echo '## Diagnostico del feed'
            echo '```'
            cat /tmp/feed.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Backtest intradia
        env:
          TIMEFRAME: ${{ github.event.inputs.timeframe || '30m' }}
          ASSETS: ${{ github.event.inputs.assets }}
        run: |
          set -o pipefail
          python validator/shark_v15_backtester.py 2>&1 | tee resultados/backtest_intradia.txt
          {
            echo '## Backtest intradia'
            echo '```'
            cat resultados/backtest_intradia.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Backtest diario 15 anos
        if: ${{ github.event.inputs.historico_largo != 'false' }}
        env:
          TIMEFRAME: "1d"
          PERIOD: "15y"
          ASSETS: ${{ github.event.inputs.assets }}
        run: |
          set -o pipefail
          python validator/shark_v15_backtester.py 2>&1 | tee resultados/backtest_diario.txt
          {
            echo '## Backtest diario (15 anos)'
            echo
            echo 'Misma logica, timeframe diario. Aqui yfinance si da'
            echo 'anos de historico, asi que la muestra es grande y el'
            echo 'resultado si es estadisticamente interpretable.'
            echo
            echo '```'
            cat resultados/backtest_diario.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Analisis de robustez (intradia)
        if: always()
        env:
          TIMEFRAME: ${{ github.event.inputs.timeframe || '30m' }}
          ASSETS: ${{ github.event.inputs.assets }}
        run: |
          set -o pipefail
          python validator/robustez.py 2>&1 | tee resultados/robustez_intradia.txt
          {
            echo '## Robustez (intradia)'
            echo '```'
            cat resultados/robustez_intradia.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Analisis de robustez (diario)
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event.inputs.historico_largo != 'false' }}
        env:
          TIMEFRAME: "1d"
          PERIOD: "15y"
          ASSETS: ${{ github.event.inputs.assets }}
        run: |
          set -o pipefail
          python validator/robustez.py 2>&1 | tee resultados/robustez_diario.txt
          {
            echo '## Robustez (diario, 15 anos)'
            echo '```'
            cat resultados/robustez_diario.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Experimento de universo
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event.inputs.historico_largo != 'false' }}
        run: |
          set -o pipefail
          python validator/experimento_universo.py 2>&1 | tee resultados/experimento_universo.txt
          {
            echo '## Experimento de universo (diversificacion)'
            echo '```'
            cat resultados/experimento_universo.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Prueba de proveedores de datos
        if: always()
        run: |
          python - <<'PY' 2>&1 | tee resultados/proveedores.txt
          import data_feed, config
          print("PRUEBA DE PROVEEDORES — cada uno por separado")
          print(f"Cascada por defecto: {config.DATA_PROVIDER_ORDER}")
          print()
          pruebas = [
              ("yfinance", "SPY",     "1d"),
              ("stooq",    "SPY",     "1d"),
              ("yfinance", "BTC-USD", "1d"),
              ("coinbase", "BTC-USD", "1d"),
              ("stooq",    "GLD",     "1d"),
          ]
          for prov, ticker, tf in pruebas:
              data_feed.DATA_PROVIDER_ORDER = [prov]
              try:
                  df, usado = data_feed.get_data(ticker, tf, "15y")
                  print(f"  OK    {prov:10} {ticker:9} {len(df):6} velas  "
                        f"{df.index[0].date()} -> {df.index[-1].date()}")
              except Exception as e:
                  print(f"  FALLA {prov:10} {ticker:9} {type(e).__name__}: {str(e)[:70]}")

          # Cruce de fuentes: si dos fuentes independientes no
          # coinciden, una de las dos trae datos malos.
          print()
          print("CRUCE yfinance vs stooq en SPY (ultimos cierres comunes)")
          try:
              data_feed.DATA_PROVIDER_ORDER = ["yfinance"]
              a, _ = data_feed.get_data("SPY", "1d", "5y")
              data_feed.DATA_PROVIDER_ORDER = ["stooq"]
              b, _ = data_feed.get_data("SPY", "1d", "5y")
              comun = a.index.normalize().intersection(b.index.normalize())
              print(f"  dias comunes: {len(comun)}")
              if len(comun) > 10:
                  import pandas as pd
                  aa = a.copy(); aa.index = aa.index.normalize()
                  bb = b.copy(); bb.index = bb.index.normalize()
                  dif = (aa.loc[comun, "Close"] - bb.loc[comun, "Close"]).abs()
                  rel = (dif / aa.loc[comun, "Close"] * 100)
                  print(f"  diferencia media: {rel.mean():.4f}%")
                  print(f"  diferencia maxima: {rel.max():.4f}%")
                  if rel.max() > 2.0:
                      print("  AVISO: discrepancia mayor del 2%: revisar")
                  else:
                      print("  Las dos fuentes concuerdan")
          except Exception as e:
              print(f"  no se pudo cruzar: {type(e).__name__}: {e}")
          PY
          {
            echo '## Proveedores de datos'
            echo '```'
            cat resultados/proveedores.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Experimento institucional (M02/M03 solo largos)
        if: always()
        run: |
          set -o pipefail
          python validator/experimento_institucional.py 2>&1 \
            | tee resultados/experimento_institucional.txt
          {
            echo '## Experimento institucional (M02/M03 como estrategias propias)'
            echo
            echo 'Solo largos: la cuenta es al contado, sin CFD.'
            echo 'Criterios fijados ANTES de ver el resultado: batir a'
            echo 'comprar y mantener del mismo universo, batir al efectivo,'
            echo 'y sostenerse en train y test por separado.'
            echo
            echo '```'
            cat resultados/experimento_institucional.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Experimento por clase de activo
        if: ${{ always() && github.ref == 'refs/heads/main' && github.event.inputs.historico_largo != 'false' }}
        run: |
          set -o pipefail
          python validator/experimento_clases.py 2>&1 | tee resultados/experimento_clases.txt
          {
            echo '## Experimento por clase de activo'
            echo '```'
            cat resultados/experimento_clases.txt
            echo '```'
            echo
          } >> resultados/ultimo.md

      - name: Generar dashboard
        if: always()
        run: |
          python dashboard/generar.py 2>&1 | tail -20

      - name: Guardar resultados en el repositorio
        # Cada rama guarda en SU rama, nunca sobre otra. Antes solo lo
        # hacia main, y eso dejaba una rama sin ninguna forma de ver lo
        # que habia salido: los logs y los artefactos de Actions no son
        # accesibles desde todos los entornos, asi que un fallo en una
        # rama era un fallo a ciegas. El [skip ci] evita el bucle.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RAMA="${GITHUB_REF_NAME}"
          git add -f resultados/ dashboard/index.html
          if git diff --cached --quiet; then
            echo "Sin cambios en resultados/"
            exit 0
          fi
          git commit -m "Resultados de validacion $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"
          # La rama puede haber avanzado mientras corria el backtest.
          for intento in 1 2 3; do
            git pull --rebase --autostash origin "$RAMA" \
              && git push origin "HEAD:$RAMA" && exit 0
            echo "reintento $intento"
            sleep 5
          done
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-validacion
          path: resultados/
          retention-days: 30
